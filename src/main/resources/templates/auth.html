<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modo == 'signin' ? 'Entrar' : 'Criar conta'} + ' | Pokédex Online'">Acesso | Pokédex Online</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/equipes.css}">
</head>
<body>
<header th:replace="~{fragments/topbar :: topbar('')}"></header>
<main class="auth-page">
    <section class="auth-panel">
        <p class="eyebrow"><span></span> Treinadores</p>
        <h1 th:text="${modo == 'signin' ? 'Entre na sua jornada.' : 'Crie seu treinador.'}">Entre na sua jornada.</h1>
        <p class="form-helper">Cadastro temporário para criar equipes, convidar pessoas e montar sua coleção.</p>
        <form class="pokemon-form" th:if="${modo == 'signin'}" th:action="@{/auth/signin}" method="post">
            <label><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
            <label><span>Senha</span><input type="password" name="senha" required autocomplete="current-password"></label>
            <button class="primary-button" type="submit">Entrar</button>
        </form>
        <form class="pokemon-form" th:if="${modo == 'signup'}" th:action="@{/auth/signup}" method="post">
            <label><span>Nome do treinador</span><input type="text" name="nome" maxlength="120" required autocomplete="name"></label>
            <label><span>Email</span><input type="email" name="email" maxlength="180" required autocomplete="email"></label>
            <label><span>Senha</span><input type="password" name="senha" minlength="4" required autocomplete="new-password"></label>
            <label><span>Confirmar senha</span><input type="password" name="confirmacao" minlength="4" required autocomplete="new-password"></label>
            <button class="primary-button" type="submit">Criar conta</button>
        </form>
        <p class="auth-switch" th:if="${modo == 'signin'}">Ainda não tem conta? <a th:href="@{/signup}">Cadastre-se</a></p>
        <p class="auth-switch" th:if="${modo == 'signup'}">Já tem conta? <a th:href="@{/signin}">Entre aqui</a></p>
    </section>
</main>
</body>
</html>
