<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nova equipe | Pokédex Online</title><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/equipes.css}"></head>
<body>
<header th:replace="~{fragments/topbar :: topbar('equipes')}"></header>
<main class="form-page"><section class="form-panel"><p class="eyebrow"><span></span> <span th:text="${equipe.id == null ? 'Nova formação' : 'Editar formação'}">Nova formação</span></p><h1 th:text="${equipe.id == null ? 'Crie sua equipe.' : 'Ajuste sua equipe.'}">Crie sua equipe.</h1><p class="page-intro">Dê um nome para o grupo e escolha os Pokémon que vão acompanhá-lo.</p><form class="pokemon-form" th:action="@{/equipes/salvar}" method="post"><input type="hidden" name="id" th:value="${equipe.id}"><label><span>Nome da equipe</span><input name="nome" th:value="${equipe.nome}" maxlength="120" required placeholder="Ex.: Insígnias do Norte"></label><label><span>Descrição</span><textarea name="descricao" maxlength="500" rows="4" th:text="${equipe.descricao}" placeholder="Qual é a estratégia da sua equipe?"></textarea></label><fieldset class="pokemon-picker"><legend>Pokémon da equipe</legend><div class="picker-grid"><label class="picker-option" th:each="pokemon : ${pokemons}"><input type="checkbox" name="pokemonIds" th:value="${pokemon.id}" th:checked="${selectedPokemonIds.contains(pokemon.id)}"><img th:src="${pokemon.imagemUrl}" th:alt="${pokemon.nome}"><span th:text="${pokemon.nome}">Pikachu</span></label></div></fieldset><div class="form-actions"><a class="secondary-button button-link" th:href="@{/equipes}">Cancelar</a><button class="primary-button" type="submit" th:text="${equipe.id == null ? 'Criar equipe' : 'Salvar equipe'}">Criar equipe</button></div></form></section></main>
</body></html>
