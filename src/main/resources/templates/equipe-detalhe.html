<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${equipe.nome} + ' | Pokédex Online'">Equipe | Pokédex Online</title><link rel="stylesheet" th:href="@{/css/theme.css}"><link rel="stylesheet" th:href="@{/css/equipes.css}"></head>
<body>
<header th:replace="~{fragments/topbar :: topbar('equipes')}"></header>
<div class="detail-actions" th:if="${podeGerenciar}"><a class="secondary-button button-link" th:href="@{/equipes/editar/{id}(id=${equipe.id})}">Editar equipe</a><form th:action="@{/equipes/{id}/excluir(id=${equipe.id})}" method="post"><button class="mini-button" type="submit">Excluir equipe</button></form></div>
<main class="detail-page"><a class="back-link" th:href="@{/equipes}">← Todas as equipes</a><section class="team-hero"><div><p class="eyebrow"><span></span> Equipe cadastrada</p><h1 th:text="${equipe.nome}">Equipe Aurora</h1><p class="page-intro" th:text="${equipe.descricao != null ? equipe.descricao : 'Sem descrição cadastrada.'}">Descrição.</p><p class="owner-line">Líder: <strong th:text="${equipe.treinador != null ? equipe.treinador.nome : 'Sem dono'}">Treinador</strong></p></div><span class="hero-team-mark">◉</span></section><section class="detail-section"><div class="section-heading"><div><p class="eyebrow"><span></span> Elenco</p><h2>Pokémon selecionados</h2></div><span class="catalog-count" th:text="|${#lists.size(equipe.pokemons)} Pokémon|">0 Pokémon</span></div><div class="roster-grid"><article class="roster-card" th:each="pokemon : ${equipe.pokemons}"><img th:src="${pokemon.imagemUrl}" th:alt="${pokemon.nome}"><div><span th:text="|#${#numbers.formatInteger(pokemon.numeroPokedex, 3)}|">#001</span><h3 th:text="${pokemon.nome}">Bulbasaur</h3><p th:text="${pokemon.tipoPrimario}">Grama</p></div></article></div><p class="empty-line" th:if="${#lists.isEmpty(equipe.pokemons)}">Esta equipe ainda não escolheu Pokémon.</p></section><section class="detail-section"><div class="section-heading"><div><p class="eyebrow"><span></span> Treinadores</p><h2>Membros da equipe</h2></div><span class="catalog-count" th:text="|${#lists.size(equipe.membros)} membros|">0 membros</span></div><div class="people-list"><article class="person-row" th:each="membro : ${equipe.membros}"><div class="avatar" th:text="${#strings.substring(membro.nome, 0, 1).toUpperCase()}">A</div><div><strong th:text="${membro.nome}">Treinador</strong><span th:text="${membro.email}">email</span></div></article></div></section></main>
</body></html>
